name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - v*

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    name: Verify Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-component,greentic-component,greentic-flow,greentic-pack
      - id: version
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; data=json.load(sys.stdin); root=data["resolve"]["root"]; print(next(pkg["version"] for pkg in data["packages"] if pkg["id"] == root))')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          expected="v$version"
          actual="${GITHUB_REF_NAME}"
          if [ "$actual" != "$expected" ]; then
            echo "Release tag must match Cargo.toml version: expected $expected, got $actual" >&2
            exit 1
          fi
      - run: bash ci/local_check.sh

  package-release:
    name: Package GitHub Release
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate package archives without publishing
        run: bash ci/local_check.sh package-only
      - name: Collect crate archives
        shell: bash
        run: |
          mkdir -p release-assets
          cp target/package/*.crate release-assets/
          sha256sum release-assets/* > release-assets/SHA256SUMS
      - name: Create GitHub Release and upload archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v${{ needs.verify.outputs.version }}" >/dev/null 2>&1 || \
            gh release create "v${{ needs.verify.outputs.version }}" --verify-tag --generate-notes
          gh release upload "v${{ needs.verify.outputs.version }}" \
            release-assets/* --clobber
