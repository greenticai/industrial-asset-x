name: Publish Industrial-X Pack

on:
  push:
    branches:
      - main
    tags:
      - industrialx-pack-v*
    paths:
      - .github/workflows/publish-industrialx-pack.yml
      - Cargo.lock
      - Cargo.toml
      - components/**
      - crates/**
      - packs/industrialx-operations/**
      - scripts/build-industrialx-pack.sh

concurrency:
  group: publish-industrialx-pack
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-component,greentic-component,greentic-flow,greentic-pack
      - name: Build and validate pack
        run: bash scripts/build-industrialx-pack.sh
      - name: Create checksums
        run: sha256sum packs/industrialx-operations/dist/*.gtpack > packs/industrialx-operations/dist/SHA256SUMS
      - name: Install ORAS
        uses: oras-project/setup-oras@v1
      - name: Publish pack to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          target="ghcr.io/${owner}/industrialx-operations"
          artifact="packs/industrialx-operations/dist/industrialx-operations.gtpack"
          created="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          short_sha="${GITHUB_SHA:0:12}"

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#industrialx-pack-v}"
            primary_tag="$version"
          else
            version="sha-${short_sha}"
            primary_tag="$version"
          fi

          printf '%s' "$GHCR_TOKEN" | oras login ghcr.io \
            --username "$GITHUB_ACTOR" \
            --password-stdin

          oras push "${target}:${primary_tag}" \
            --artifact-type application/vnd.greentic.gtpack.v1 \
            --annotation "org.opencontainers.image.created=${created}" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.title=industrialx-operations.gtpack" \
            --annotation "org.opencontainers.image.version=${version}" \
            "${artifact}:application/octet-stream"

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            oras tag "${target}:${primary_tag}" release latest
          else
            oras tag "${target}:${primary_tag}" latest
          fi
          oras manifest fetch "${target}:${primary_tag}" >/dev/null
      - name: Create GitHub Release and upload pack
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" --verify-tag --generate-notes
          gh release upload "${{ github.ref_name }}" \
            packs/industrialx-operations/dist/* \
            packs/industrialx-operations/provenance.json \
            --clobber
