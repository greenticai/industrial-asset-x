name: Publish Designer Extension

# Publishes greentic.industrial-x-designer (.gtxpack) on `designer-ext-v*` tag
# pushes. Version published = tag name with the leading `designer-ext-v`
# stripped. Modelled on components-public's publish-webhook-extension.yml.
#
# Needs repository configuration that this file does NOT create:
#   vars.GREENTIC_STORE_URL        Store base URL
#   secrets.GREENTIC_STORE_TOKEN   Store API token (gts_...)
#   secrets.EXT_SIGNING_KEY_PEM    PKCS8 ed25519 PEM that authenticates the upload

on:
  push:
    tags: ['designer-ext-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Extension version to publish (must match describe.json)'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Derive version from tag
        id: ver
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#designer-ext-v}"
          fi
          echo "==> Publishing greentic.industrial-x-designer@${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - uses: greenticai/greentic-designer-extension-action@v2
        with:
          # Pin required: describe.json is greentic.ai/v2, which the default
          # (latest crates.io) gtdx rejects. Same pin as components-public.
          gtdx-version: "=1.3.0-research.1"
          manifest: extensions/designer-playbook-ext/Cargo.toml
          store-url: ${{ vars.GREENTIC_STORE_URL }}
          store-token: ${{ secrets.GREENTIC_STORE_TOKEN }}
          # Authenticates the UPLOAD. The Store re-signs what it serves with
          # the `greentic` publisher key; the action fails closed without it.
          signing-key-pem: ${{ secrets.EXT_SIGNING_KEY_PEM }}
          version: ${{ steps.ver.outputs.version }}
