[package]
name = "generic-feature-extractor-wasm"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"
description = "Greentic component generic-feature-extractor-wasm"
publish = false
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.greentic]
abi_version = "0.6.0"

[package.metadata.component]
package = "greentic:component"

[package.metadata.component.target]
world = "greentic:component/component@0.6.0"

[dependencies]
greentic-types = { version = ">=1.1.0-dev, <1.2.0-0" }
greentic-interfaces-guest = { version = ">=1.1.0-dev, <1.2.0-0", default-features = false, features = ["component-v0-6"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
industrialx-features = { path = "../../crates/industrialx-features" }

[build-dependencies]
greentic-types = { version = ">=1.1.0-dev, <1.2.0-0" }
serde_json = "1"
