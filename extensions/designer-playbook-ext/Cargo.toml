[package]
name = "greentic-industrial-x-designer-extension"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT"
publish = false
description = "Industrial-X Designer extension: playbook authoring, catalog and validation tools"

# Standalone crate: it targets wasm32-wasip2 with its own toolchain file and is
# deliberately not a member of the repository workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
jsonschema = { version = "0.33", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = "0.41"
wit-bindgen-rt = "0.41"

[package.metadata.component]
package = "greentic:industrial-x-designer-extension"

[package.metadata.component.target]
path = "wit"
world = "design-extension"

[package.metadata.component.target.dependencies]
"greentic:extension-base" = { path = "wit/deps/extension-base/extension-base.wit" }
"greentic:extension-host" = { path = "wit/deps/extension-host/extension-host.wit" }
"greentic:extension-design" = { path = "wit/deps/extension-design/extension-design.wit" }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
doc_markdown = "allow"
must_use_candidate = "allow"
